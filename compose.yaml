services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FITSPACE_ORIGIN: ${FITSPACE_ORIGIN:?Set FITSPACE_ORIGIN to your HTTPS URL}
      FITSPACE_DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - fitspace_data:/app/data
volumes:
  fitspace_data:
